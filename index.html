<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quadro de Produção</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>


<div id="login-screen" class="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-dot"></div>
      <div class="login-title">Controle de Produção</div>
    </div>
    <div class="login-subtitle">Metalrail</div>
    <div class="login-fg"><label>E-mail</label><input id="login-email" type="email" placeholder="seu@metalrail.com.br" /></div>
    <div class="login-fg"><label>Senha</label><input id="login-senha" type="password" placeholder="••••••••" /></div>
    <div class="login-err" id="login-err"></div>
    <button class="login-btn" onclick="doLogin()">Entrar como editor</button>
    <button class="login-visitor" onclick="doVisitor()">👁 Acessar como visitante (somente leitura)</button>
  </div>
</div>

<div class="topbar" id="main-app" style="display:none">
  <div class="topbar-left">
    <div class="sync-status"><span class="sync-dot" id="sync-dot"></span><span id="sync-txt">Conectando...</span></div>
  </div>
  <div class="topbar-center">
    <div class="topbar-title"><div class="topbar-title-dot"></div> Controle de Produção — Metalrail</div>
  </div>
  <div class="topbar-right">
    <div class="user-badge" id="user-badge" style="display:none"></div>
    <button class="logout-btn" id="logout-btn" onclick="doLogout()" style="display:none">Sair</button>
    <button class="btn btn-print" onclick="printBoard()">&#128438; Imprimir</button>
    <button class="btn btn-nova" onclick="openModal()">+ Nova OS</button>
  </div>
</div>

<div style="position:relative"><div class="tab-nav" style="display:flex;align-items:center;justify-content:space-between;padding-right:12px">
  <button class="tab-btn active" id="tab-quadro" onclick="switchTab('quadro')">&#9632; Quadro</button>
  <button class="tab-btn" id="tab-desempenho" onclick="switchTab('desempenho')">&#128200; Desempenho</button>
  <div style="flex:1;max-width:340px;margin-left:auto">
    <div class="search-bar" style="margin-bottom:0;height:32px;padding:4px 12px">
      <span style="font-size:13px">🔍</span>
      <input class="search-input" id="search-input" placeholder="Buscar OS por número ou cliente..." oninput="searchOS(this.value)" style="font-size:13px" />
    </div>
  </div>
</div>
<div id="search-results" style="display:none;position:absolute;z-index:50;left:0;right:0;padding:0 20px;top:44px;max-height:60vh;overflow-y:auto"></div></div>

<div class="main" id="main-quadro">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;width:100%">
    <button class="btn-nav prev" id="btn-week-prev" onclick="changeWeek(-1)">&#8249;</button>
    <div class="week-lbl" id="week-lbl" style="font-size:15px;font-weight:700;color:#1a1a2e;min-width:200px;text-align:center">Carregando...</div>
    <button class="btn-nav next" id="btn-week-next" onclick="changeWeek(1)">&#8250;</button>
    <div style="flex:1"></div>
    <div id="gerar-semana-bar-wrap"></div>
  </div>
  <div class="notice" id="notice" style="display:none"></div>
  <div id="loading" class="loading"><div class="spinner"></div> Conectando ao banco de dados...</div>
  <div class="board" id="board" style="display:none"></div>
</div>


<div id="main-desempenho" style="display:none;padding:16px">
  <div class="aba-week-nav">
    <button class="btn-nav prev" id="btn-desemp-prev" onclick="changeDesempWeek(-1)">&#8249;</button>
    <div class="week-lbl" id="desemp-week-lbl">Carregando...</div>
    <button class="btn-nav next" id="btn-desemp-next" onclick="changeDesempWeek(1)">&#8250;</button>
  </div>
  <div class="summary-bar" id="summary-bar"></div>
  <div class="desemp-grid" id="desemp-grid"></div>
</div>

<!-- MODAL CRIAR / EDITAR -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-title">Nova ordem de serviço</div>
    <div class="fg"><label>Nº da OS</label><input id="m-os" placeholder="OS-001" /></div>
    <div class="fg"><label>Cliente</label><input id="m-cli" placeholder="Nome do cliente" /></div>
    <div class="fg"><label>Data de entrega</label><input id="m-dt" type="date" /></div>
    <div class="fg">
      <label>Ordem urgente?</label>
      <div class="urgente-toggle">
        <button type="button" class="urg-btn" id="urg-nao" onclick="setUrgente(false)">Não</button>
        <button type="button" class="urg-btn active-nao" id="urg-sim" onclick="setUrgente(true)">🚨 Sim</button>
      </div>
    </div>
    <div class="section-label">&#9201; Tempo estimado por setor</div>
    <div class="setores-grid">
      <div class="sg"><label>Laser</label><input id="h-laser" placeholder="00:00" maxlength="6" oninput="fmtTime(this)" /></div>
      <div class="sg"><label>Dobra</label><input id="h-dobra" placeholder="00:00" maxlength="6" oninput="fmtTime(this)" /></div>
      <div class="sg"><label>Solda</label><input id="h-solda" placeholder="00:00" maxlength="6" oninput="fmtTime(this)" /></div>
      <div class="sg"><label>Acabamento</label><input id="h-acab" placeholder="00:00" maxlength="6" oninput="fmtTime(this)" /></div>
      <div class="sg"><label>Inspeção</label><input id="h-insp" placeholder="00:00" maxlength="6" oninput="fmtTime(this)" /></div>
      <div class="sg"><label>Expedição</label><input id="h-exped" placeholder="00:00" maxlength="6" oninput="fmtTime(this)" /></div>
    </div>
    <div class="fmt-hint">Formato HH:MM — ex: 01:30 = 1 hora e 30 min</div>
    <div class="m-err" id="m-err"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-add" id="btn-save" onclick="saveCard()">Adicionar OS</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
