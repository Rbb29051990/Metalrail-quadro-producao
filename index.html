<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quadro de Produção</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',Arial,sans-serif;background:#F0F2F8;color:#1a1a2e;min-height:100vh}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#1a1a2e;height:56px;gap:8px;position:relative}
  .topbar-center{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}
  .topbar-left{display:flex;align-items:center;gap:16px}
  .topbar-title{font-size:18px;font-weight:800;color:#fff;letter-spacing:-0.3px;display:flex;align-items:center;gap:8px}
  .topbar-title-dot{width:10px;height:10px;border-radius:50%;background:#534AB7}
  .week-nav{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.08);border-radius:10px;padding:4px 8px}
  .week-lbl{font-size:13px;font-weight:600;color:#fff;min-width:180px;text-align:center}
  .btn-nav{width:28px;height:28px;border:none;border-radius:7px;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;font-weight:700}
  .btn-nav.prev{background:#FEE2E2;color:#dc2626;border:1.5px solid #FECACA}
  .btn-nav.prev:hover{background:#FECACA}
  .btn-nav.next{background:#DCFCE7;color:#15803d;border:1.5px solid #86EFAC}
  .btn-nav.next:hover{background:#BBF7D0}
  .btn-nav:hover{background:rgba(255,255,255,0.25)}
  .topbar-right{display:flex;gap:10px;align-items:center}
  .sync-status{font-size:12px;color:rgba(255,255,255,0.5);display:flex;align-items:center;gap:5px}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:#555}
  .sync-dot.ok{background:#4ade80}
  .sync-dot.saving{background:#facc15;animation:pulse 1s infinite}
  .sync-dot.err{background:#f87171}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .btn{height:36px;padding:0 18px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;font-family:'Inter',Arial,sans-serif}
  .btn-print{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2)}
  .btn-print:hover{background:rgba(255,255,255,0.2)}
  .btn-nova{background:linear-gradient(135deg,#534AB7,#7C3AED);color:#fff;box-shadow:0 2px 12px rgba(83,74,183,0.4)}
  .btn-nova:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(83,74,183,0.5)}

  .main{padding:20px}
  .notice{background:#EEF2FF;border:1px solid #C7D2FE;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:500;color:#4338CA;display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;align-items:start}

  .col{border-radius:10px;padding:6px;border:2px solid transparent}
  .cards-list{overflow-y:auto;overflow-x:hidden;max-height:520px}
  .cards-list::-webkit-scrollbar{width:3px}
  .cards-list::-webkit-scrollbar-track{background:transparent}
  .cards-list::-webkit-scrollbar-thumb{background:rgba(83,74,183,0.25);border-radius:2px}
  .cards-list::-webkit-scrollbar-thumb:hover{background:rgba(83,74,183,0.5)}
  .cards-list::-webkit-scrollbar{width:4px}
  .cards-list::-webkit-scrollbar-track{background:transparent}
  .cards-list::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.2);border-radius:2px}
  .cards-list::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.35)}
  .col-fila {background:#F1F5F9;border-color:#CBD5E1}
  .col-laser{background:#EDE9FE;border-color:#C4B5FD}
  .col-dobra{background:#DBEAFE;border-color:#93C5FD}
  .col-solda{background:#FFE4E6;border-color:#FCA5A5}
  .col-acab {background:#FEF3C7;border-color:#FCD34D}
  .col-insp {background:#D1FAE5;border-color:#6EE7B7}
  .col-exped{background:#E0F2FE;border-color:#7DD3FC}
  .col-terc {background:#F5F3FF;border-color:#DDD6FE}
  .col-conc {background:#DCFCE7;border-color:#86EFAC}

  .col-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;gap:4px}
  .col-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .col-count{font-size:10px;font-weight:700;opacity:.55;margin-left:2px}

  .cap-box{border-radius:7px;padding:5px 7px;margin-bottom:6px;border:1px solid rgba(0,0,0,0.07)}
  .col-laser .cap-box{background:rgba(167,139,250,0.15)}
  .col-dobra .cap-box{background:rgba(147,197,253,0.2)}
  .col-solda .cap-box{background:rgba(252,165,165,0.15)}
  .col-acab  .cap-box{background:rgba(252,211,77,0.15)}
  .col-insp  .cap-box{background:rgba(110,231,183,0.15)}
  .col-exped .cap-box{background:rgba(125,211,252,0.2)}

  .cap-row{display:flex;align-items:center;gap:5px;margin-bottom:4px}
  .cap-input{width:72px;height:26px;padding:0 4px;border:1.5px solid rgba(0,0,0,0.15);border-radius:6px;background:#fff;color:#1a1a2e;font-size:12px;font-weight:700;text-align:center;font-family:'Inter',Arial,sans-serif;letter-spacing:.5px;transition:border .15s}
  .cap-input:focus{outline:none;border-color:#534AB7;box-shadow:0 0 0 3px rgba(83,74,183,0.15)}
  .cap-label{font-size:9px;font-weight:600;color:#888;line-height:1.2;white-space:nowrap}
  .saldo{font-size:11px;font-weight:700;margin-bottom:3px}
  .saldo.ok  {color:#15803d}
  .saldo.warn{color:#b45309}
  .saldo.over{color:#dc2626}
  .saldo.neu {color:#94a3b8}
  .extra-pill{display:inline-flex;align-items:center;gap:2px;font-size:8px;font-weight:700;padding:1px 5px;border-radius:100px;background:#FEE2E2;color:#dc2626;border:1px solid #FECACA;margin-bottom:2px}
  .cap-bar{height:5px;background:rgba(0,0,0,0.1);border-radius:3px;margin-top:6px;overflow:hidden}
  .cap-fill{height:100%;border-radius:3px;transition:width .4s}
  .no-cap-spacer{height:48px}

  /* CARDS */
  .card{background:#fff;border:1px solid rgba(0,0,0,0.08);border-radius:8px;padding:6px 8px;margin-bottom:4px;cursor:grab;user-select:none;transition:transform .12s,box-shadow .12s}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.1)}
  .card:active{cursor:grabbing;opacity:.75;transform:scale(.97)}
  .card.dragging{opacity:.25}
  .card.carried{border-left:4px solid #7C3AED}
  .carried-tag{font-size:8px;font-weight:700;color:#7C3AED;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
  .card-os{font-size:12px;font-weight:800;color:#1a1a2e;letter-spacing:-0.2px}
  .card-cli{font-size:10px;font-weight:500;color:#64748b;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
  .card-h{font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px;background:#F1F5F9;color:#475569;display:inline-flex;align-items:center;gap:3px;letter-spacing:.3px}
  .card-track{display:flex;gap:2px;margin-top:3px;flex-wrap:nowrap;overflow:hidden}
  .track-sq{width:16px;height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;color:#fff;position:relative;opacity:.22;transition:opacity .2s;letter-spacing:0;flex-shrink:0}
  .track-sq.passed{opacity:1}
  .track-sq.passed::after{content:'';position:absolute;top:50%;left:10%;width:80%;height:2px;background:rgba(255,255,255,0.95);border-radius:1px;transform:translateY(-50%) rotate(-45deg)}
  .track-sq.current{opacity:1;box-shadow:0 0 0 2px #fff,0 0 0 3.5px currentColor}
  .card-btns{display:flex;gap:4px;opacity:0;transition:opacity .15s}
  .card:hover .card-btns{opacity:1}
  .ib{width:26px;height:26px;border:none;background:#F1F5F9;cursor:pointer;color:#64748b;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;transition:all .12s;font-family:'Inter',Arial,sans-serif}
  .ib:hover{background:#E2E8F0;color:#1a1a2e}
  .ib.edit:hover{color:#534AB7;background:#EDE9FE}
  .ib.del:hover{color:#dc2626;background:#FEE2E2}

  .drop-zone{min-height:28px;border:1.5px dashed rgba(0,0,0,0.1);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .drop-zone.over{border-color:#534AB7;background:rgba(83,74,183,0.06)}
  .drop-hint{font-size:11px;font-weight:500;color:#94a3b8}

  /* MODAL */
  .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  .modal-overlay.open{display:flex}
  .modal{background:#fff;border-radius:20px;padding:14px 18px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,0.2);max-height:95vh;overflow-y:auto;overflow-x:hidden}
  .modal-title{font-size:17px;font-weight:800;color:#1a1a2e;margin-bottom:14px;letter-spacing:-0.4px}
  .fg{margin-bottom:6px}
  .fg label{display:block;font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
  .fg input{width:100%;height:34px;padding:0 10px;border:2px solid #E2E8F0;border-radius:8px;font-size:13px;font-weight:500;font-family:'Inter',Arial,sans-serif;color:#1a1a2e;transition:border .15s}
  .fg input:focus{outline:none;border-color:#534AB7;box-shadow:0 0 0 3px rgba(83,74,183,0.12)}
  .section-label{font-size:11px;font-weight:800;color:#534AB7;margin-bottom:6px;padding-bottom:3px;border-bottom:2px solid #EEF2FF;text-transform:uppercase;letter-spacing:.07em}
  .setores-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:6px}
  .sg{display:flex;flex-direction:column;gap:3px}
  .sg label{font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em}
  .sg input{width:100%;height:32px;padding:0 4px;border:2px solid #E2E8F0;border-radius:7px;font-size:13px;font-weight:700;font-family:'Inter',Arial,sans-serif;color:#1a1a2e;text-align:center;letter-spacing:.5px;transition:border .15s}
  .sg input:focus{outline:none;border-color:#534AB7;box-shadow:0 0 0 3px rgba(83,74,183,0.12)}
  .fmt-hint{font-size:10px;color:#94a3b8;margin-bottom:10px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
  .btn-cancel{height:38px;padding:0 18px;border:2px solid #E2E8F0;border-radius:10px;background:#fff;color:#64748b;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',Arial,sans-serif}
  .btn-cancel:hover{background:#F8FAFC}
  .btn-add{height:38px;padding:0 24px;border:none;border-radius:10px;background:linear-gradient(135deg,#534AB7,#7C3AED);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',Arial,sans-serif;box-shadow:0 2px 12px rgba(83,74,183,0.3)}
  .btn-add:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(83,74,183,0.4)}
  .m-err{font-size:12px;color:#dc2626;margin-bottom:8px;min-height:16px;font-weight:500}

  .loading{display:flex;align-items:center;justify-content:center;height:200px;color:#94a3b8;font-size:15px;font-weight:500;gap:10px}
  .spinner{width:20px;height:20px;border:2.5px solid #E2E8F0;border-top-color:#534AB7;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* LOGIN */
  .login-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#F0F2F8;z-index:999;display:flex;align-items:center;justify-content:center}
  .login-box{background:#fff;border-radius:20px;padding:36px 32px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,0.12)}
  .login-logo{display:flex;align-items:center;gap:10px;margin-bottom:24px;justify-content:center}
  .login-logo-dot{width:12px;height:12px;border-radius:50%;background:#534AB7}
  .login-title{font-size:18px;font-weight:800;color:#1a1a2e}
  .login-subtitle{font-size:12px;color:#94a3b8;text-align:center;margin-bottom:24px;margin-top:-16px}
  .login-fg{margin-bottom:14px}
  .login-fg label{display:block;font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
  .login-fg input{width:100%;height:42px;padding:0 14px;border:2px solid #E2E8F0;border-radius:10px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1a1a2e;transition:border .15s}
  .login-fg input:focus{outline:none;border-color:#534AB7;box-shadow:0 0 0 3px rgba(83,74,183,0.12)}
  .login-btn{width:100%;height:44px;border:none;border-radius:10px;background:linear-gradient(135deg,#534AB7,#7C3AED);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',Arial,sans-serif;margin-top:4px;transition:all .15s}
  .login-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(83,74,183,0.4)}
  .login-err{font-size:12px;color:#dc2626;min-height:16px;margin-bottom:8px;font-weight:500;text-align:center}
  .login-visitor{width:100%;height:36px;border:1.5px solid #E2E8F0;border-radius:10px;background:#fff;color:#64748b;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',Arial,sans-serif;margin-top:8px;transition:all .15s}
  .login-visitor:hover{background:#F8FAFC}
  /* USER BADGE */
  .user-badge{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.1);border-radius:8px;padding:4px 10px}
  .user-badge-name{font-size:12px;font-weight:600;color:#fff}
  .user-badge-role{font-size:10px;color:rgba(255,255,255,0.5);font-weight:500}
  .logout-btn{height:28px;padding:0 10px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;background:none;color:rgba(255,255,255,0.6);font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',Arial,sans-serif;transition:all .15s}
  .logout-btn:hover{background:rgba(255,255,255,0.1);color:#fff}
  /* MODO LEITURA */
  .readonly .btn-nova{display:none!important}
  .readonly .btn-gerar{display:none!important}
  .readonly .cap-input{pointer-events:none;opacity:.7}
  .readonly .ib{display:none!important}
  .readonly .card{cursor:default}
  .readonly .card[draggable]{cursor:default}
  .readonly .drop-zone{display:none}
  .readonly .gerar-semana-bar .btn-gerar{display:none}
  /* BUSCA */
  .search-bar{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #E2E8F0;border-radius:8px;padding:4px 12px;margin-bottom:0}
  .search-input{flex:1;border:none;outline:none;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1a1a2e;background:none}
  .search-input::placeholder{color:#94a3b8}
  .search-results{background:#fff;border:1.5px solid #E2E8F0;border-radius:12px;padding:12px 16px;margin-bottom:16px}
  .search-result-item{padding:8px 0;border-bottom:1px solid #F1F5F9;display:flex;align-items:center;gap:12px}
  .search-result-item:last-child{border-bottom:none}
  .search-result-os{font-size:14px;font-weight:800;color:#1a1a2e;min-width:80px}
  .search-result-cli{font-size:12px;color:#64748b;flex:1}
  .search-result-loc{font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;background:#EDE9FE;color:#534AB7}
  .search-result-week{font-size:10px;color:#94a3b8;margin-left:4px}
  .search-empty{text-align:center;padding:16px;color:#94a3b8;font-size:13px}


  /* BOTÃO GERAR SEMANA */
  .gerar-semana-bar{display:flex;align-items:center;gap:8px}
  .gerar-semana-info{font-size:12px;font-weight:600;color:#92400E}
  .gerar-semana-info.gerada{color:#166534}
  .btn-gerar{height:30px;padding:0 12px;border:none;border-radius:8px;background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',Arial,sans-serif;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
  .btn-gerar:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(217,119,6,0.4)}
  .btn-gerar.gerada{background:linear-gradient(135deg,#22c55e,#16a34a);cursor:default;transform:none;box-shadow:none}
  .espelho-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D}
  /* ORDENAÇÃO MANUAL */
  .card{position:relative}
  .card-order-btns{position:absolute;right:-28px;top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:2px}
  .card:hover .card-order-btns{display:flex}
  .order-btn{width:22px;height:22px;border:1.5px solid #E2E8F0;border-radius:5px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#64748b;transition:all .12s}
  .order-btn:hover{background:#534AB7;color:#fff;border-color:#534AB7}

  .aba-week-nav{display:flex;align-items:center;gap:8px;margin-bottom:0}
  .urgente-toggle{display:flex;gap:8px}
  .urg-btn{flex:1;height:36px;border:2px solid #E2E8F0;border-radius:8px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',Arial,sans-serif;color:#64748b;transition:all .15s}
  .urg-btn.active-nao{background:#FEE2E2;border-color:#FCA5A5;color:#dc2626}
  .urg-btn.active-sim{background:#FEE2E2;border-color:#FCA5A5;color:#dc2626}
  .urg-btn.selected-nao{background:#F0FDF4;border-color:#86EFAC;color:#15803d}
  .card.urgente{border:2px solid #FCA5A5;background:#FFF5F5}
  .card.urgente .card-os{color:#dc2626}
  .urgente-badge{display:inline-flex;align-items:center;gap:2px;font-size:8px;font-weight:700;color:#dc2626;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
  .aba-week-nav .week-lbl{font-size:14px;font-weight:700;color:#1a1a2e;min-width:200px;text-align:center}

  .tab-nav{display:flex;gap:0;background:#13132a;padding:0 16px;border-bottom:2px solid rgba(255,255,255,0.07);align-items:center}
  .tab-btn{height:44px;padding:0 22px;border:none;background:none;color:rgba(255,255,255,0.45);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',Arial,sans-serif;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;display:inline-flex;align-items:center;gap:7px}
  .tab-btn:hover{color:rgba(255,255,255,0.75)}
  .tab-btn.active{color:#fff;border-bottom-color:#7C3AED}

  /* PAINEL DESEMPENHO */
  .desemp-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:4px}
  .desemp-card{background:#fff;border-radius:16px;padding:16px;border:2px solid #E2E8F0}
  .desemp-header{display:flex;align-items:center;gap:7px;margin-bottom:14px}
  .desemp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .desemp-setor{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
  .desemp-metric-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
  .desemp-pct{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1}
  .desemp-pct.green{color:#15803d}
  .desemp-pct.yellow{color:#b45309}
  .desemp-pct.red{color:#dc2626}
  .desemp-pct.gray{color:#94a3b8}
  .desemp-pct.over{color:#dc2626}
  .desemp-label{font-size:10px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .desemp-bar-bg{height:6px;background:#F1F5F9;border-radius:3px;margin-bottom:12px;overflow:hidden}
  .desemp-bar-fill{height:100%;border-radius:3px;transition:width .5s}
  .desemp-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .desemp-stat{background:#F8FAFC;border-radius:8px;padding:8px 10px}
  .desemp-stat-val{font-size:15px;font-weight:800;color:#1a1a2e}
  .desemp-stat-lbl{font-size:9px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em;margin-top:1px}

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqL12msSsUnbDkcIuD0o2nHdmsEUTXtH8",
  authDomain: "quadro-producao.firebaseapp.com",
  projectId: "quadro-producao",
  storageBucket: "quadro-producao.firebasestorage.app",
  messagingSenderId: "583907452710",
  appId: "1:583907452710:web:1c1a5ca92b196e93eec3e7",
  measurementId: "G-NRF3L8ZRS4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// ─── UTILS TEMPO ──────────────────────────────────
function timeToMin(str){
  if(!str||!str.includes(':'))return 0;
  const [h,m]=str.split(':').map(Number);
  return (h||0)*60+(m||0);
}
function minToTime(min){
  if(!min||min<=0)return '00:00';
  const h=Math.floor(min/60),m=min%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
window.fmtTime=function(input){
  let v=input.value.replace(/[^0-9]/g,'');
  if(v.length>5)v=v.slice(0,5);
  if(v.length>=3){
    const h=parseInt(v.slice(0,v.length-2))||0;
    const m=v.slice(-2);
    input.value=h+':'+m;
  } else if(v.length===2){
    input.value='0:'+v;
  } else {
    input.value=v;
  }
};
window.fmtCap=function(input){
  let v=input.value.replace(/[^0-9]/g,'');
  if(v.length>5)v=v.slice(0,5);
  if(v.length>=3){
    const h=parseInt(v.slice(0,v.length-2))||0;
    const m=v.slice(-2);
    input.value=h+':'+m;
  } else if(v.length===2){
    input.value='0:'+v;
  } else {
    input.value=v;
  }
};

// ─── CONSTANTES ───────────────────────────────────
const COLS=[
  {id:'fila', label:'Fila de espera',color:'#475569',cls:'col-fila', noCap:true},
  {id:'laser',label:'Laser',         color:'#6D28D9',cls:'col-laser'},
  {id:'dobra',label:'Dobra',         color:'#1d4ed8',cls:'col-dobra'},
  {id:'solda',label:'Solda',         color:'#be123c',cls:'col-solda'},
  {id:'acab', label:'Acabamento',    color:'#b45309',cls:'col-acab'},
  {id:'terc', label:'Terceiros',     color:'#7c3aed',cls:'col-terc', noCap:true,noTime:true},
  {id:'insp', label:'Inspeção',      color:'#15803d',cls:'col-insp'},
  {id:'exped',label:'Expedição',     color:'#0369a1',cls:'col-exped'},
  {id:'conc', label:'Concluídos',    color:'#166534',cls:'col-conc', noCap:true},
];
const FLUXO=['fila','laser','dobra','solda','acab','terc','insp','exped','conc'];
const SETOR_IDS=['laser','dobra','solda','acab','insp','exped'];
const TRACK_COLS=COLS.filter(c=>c.id!=='fila'&&c.id!=='conc');
const TRACK_LABEL={laser:'LA',dobra:'DO',solda:'SO',acab:'AC',terc:'TE',insp:'IN',exped:'EX'};
const PRINT_COLS=COLS.filter(c=>!c.noCap);

// ─── SEMANA ────────────────────────────────────────
function weekKeyFromDate(d){
  const jan1=new Date(d.getFullYear(),0,1);
  const wk=Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7);
  return `${d.getFullYear()}-W${String(wk).padStart(2,'0')}`;
}
function weekLabel(key){
  const [yr,wn]=key.split('-W');
  const jan1=new Date(Number(yr),0,1);
  const mon=new Date(jan1);
  mon.setDate(jan1.getDate()+(Number(wn)-1)*7-(jan1.getDay()||7)+1);
  const fri=new Date(mon);fri.setDate(mon.getDate()+4);
  const fmt=x=>x.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  return `Semana ${parseInt(wn)} — ${fmt(mon)} a ${fmt(fri)}`;
}
function nextWeekKey(key){
  const [yr,wn]=key.split('-W');
  const d=new Date(Number(yr),0,1+(Number(wn)-1)*7);
  d.setDate(d.getDate()+7);
  return weekKeyFromDate(d);
}
function prevWeekKey(key){
  const [yr,wn]=key.split('-W');
  const d=new Date(Number(yr),0,1+(Number(wn)-1)*7);
  d.setDate(d.getDate()-7);
  return weekKeyFromDate(d);
}

// ─── ESTADO ────────────────────────────────────────
let currentWeek=weekKeyFromDate(new Date());
let weekData={cards:[],caps:{},nextId:1,gerada:false};
let unsubscribeCurrent=null;
let unsubscribeNext=null;
let dragId=null;
let dragSourceCol=null;
let editingId=null;
let isUrgente=false;
let isSaving=false;

// ─── SYNC STATUS ───────────────────────────────────
function setSyncStatus(s){
  const dot=document.getElementById('sync-dot');
  const txt=document.getElementById('sync-txt');
  if(s==='ok'){dot.className='sync-dot ok';txt.textContent='Sincronizado';}
  else if(s==='saving'){dot.className='sync-dot saving';txt.textContent='Salvando...';}
  else if(s==='err'){dot.className='sync-dot err';txt.textContent='Erro de conexão';}
  else{dot.className='sync-dot';txt.textContent='Conectando...';}
}
function docRef(w){return doc(db,'semanas',w);}

// ─── SAVE ──────────────────────────────────────────
async function saveWeek(propagate=true){
  if(isSaving)return;
  isSaving=true;
  setSyncStatus('saving');
  try{
    await setDoc(docRef(currentWeek),weekData);
    setSyncStatus('ok');
    if(propagate) await syncToNext();
  }catch(e){setSyncStatus('err');}
  isSaving=false;
}

// ─── SYNC PARA PRÓXIMA ─────────────────────────────
// Regra: SEMPRE sincroniza cartões não-concluídos da semana atual para a próxima
// Se a próxima já foi gerada (independente), apenas adiciona OS novas que ainda não existem lá
// e remove OS que foram concluídas aqui. NÃO move cartões já existentes na próxima.
async function syncToNext(){
  const next=nextWeekKey(currentWeek);
  const nextSnap=await getDoc(docRef(next));
  const nextData=nextSnap.exists()?nextSnap.data():{cards:[],caps:{},nextId:1,gerada:false};
  const nextGerada=nextData.gerada===true;

  // Pendentes da semana atual (não concluídos)
  const pendentes=weekData.cards.filter(c=>c.col!=='conc');
  // Concluídos da semana atual
  const concluidosOS=new Set(weekData.cards.filter(c=>c.col==='conc').map(c=>c.os));

  let modified=false;

  if(!nextGerada){
    // Semana seguinte ainda é espelho: recria do zero com os pendentes atuais
    // preservando capacidades já definidas lá
    const caps=nextData.caps||{};
    const snapshot={
      cards: pendentes.map((c,i)=>({
        ...JSON.parse(JSON.stringify(c)),
        id:i+1,
        carriedFrom:currentWeek
      })),
      caps,
      nextId:pendentes.length+1,
      gerada:false
    };
    await setDoc(docRef(next),snapshot);
    return;
  }

  // Semana seguinte JÁ FOI GERADA (independente):
  // 1. Remove OS que foram concluídas na semana atual
  const antes=nextData.cards.length;
  nextData.cards=nextData.cards.filter(c=>{
    if(c.carriedFrom===currentWeek && concluidosOS.has(c.os)) return false;
    return true;
  });
  if(nextData.cards.length<antes) modified=true;

  // 2. Adiciona OS novas que existem na atual mas ainda não estão na próxima
  const osNaProxima=new Set(nextData.cards.map(c=>c.os));
  pendentes.forEach(c=>{
    if(!osNaProxima.has(c.os)){
      const copia=JSON.parse(JSON.stringify(c));
      copia.id=nextData.nextId++;
      copia.carriedFrom=currentWeek;
      // Sem ordem manual — vai para o fim, ordenado por data
      delete copia.ordem;
      nextData.cards.push(copia);
      modified=true;
    }
  });

  if(modified) await setDoc(docRef(next),nextData);
}

// ─── GERAR PRÓXIMA SEMANA ──────────────────────────
window.gerarProximaSemana=async function(){
  if(!confirm('Confirma? As semanas se tornam independentes.\nOS novas da semana 22 ainda aparecerão na 23, mas movimentos não serão espelhados.')) return;
  const next=nextWeekKey(currentWeek);
  const nextSnap=await getDoc(docRef(next));
  const caps=nextSnap.exists()?(nextSnap.data().caps||{}):{};
  const pendentes=weekData.cards.filter(c=>c.col!=='conc');
  const snapshot={
    cards:pendentes.map((c,i)=>({...JSON.parse(JSON.stringify(c)),id:i+1,carriedFrom:currentWeek})),
    caps,
    nextId:pendentes.length+1,
    gerada:false // a próxima começa não-gerada
  };
  await setDoc(docRef(next),snapshot);
  // Marca semana ATUAL como gerada
  weekData.gerada=true;
  await saveWeek(false);
  renderGerarBar();
};

// ─── LOAD WEEK ─────────────────────────────────────
// Sincroniza a semana atual a partir da semana anterior
// Roda sempre ao navegar para qualquer semana
async function syncFromPrev(week){
  const prev=prevWeekKey(week);
  const prevSnap=await getDoc(docRef(prev));
  if(!prevSnap.exists())return; // sem semana anterior, nada a fazer

  const prevData=prevSnap.data();
  const currSnap=await getDoc(docRef(week));
  const currData=currSnap.exists()?currSnap.data():{cards:[],caps:{},nextId:1,gerada:false};

  // Se a semana atual já foi gerada como independente:
  // só adiciona OS novas da anterior e remove as concluídas lá
  if(currData.gerada){
    const conclOS=new Set(prevData.cards.filter(c=>c.col==='conc').map(c=>c.os));
    const antes=currData.cards.length;
    // Remove OS que foram concluídas na semana anterior
    currData.cards=currData.cards.filter(c=>{
      if(c.carriedFrom===prev&&conclOS.has(c.os))return false;
      return true;
    });
    // Adiciona OS novas pendentes que ainda não estão na semana atual
    const osNaAtual=new Set(currData.cards.map(c=>c.os));
    const novas=prevData.cards.filter(c=>c.col!=='conc'&&!osNaAtual.has(c.os));
    novas.forEach(card=>{
      const copia=JSON.parse(JSON.stringify(card));
      copia.id=currData.nextId++;
      copia.carriedFrom=prev;
      delete copia.ordem;
      currData.cards.push(copia);
    });
    if(currData.cards.length!==antes||novas.length>0){
      await setDoc(docRef(week),currData);
    }
    return;
  }

  // Semana atual ainda NÃO foi gerada: recria como espelho completo da anterior
  const caps=currData.caps||{};
  const pendentes=prevData.cards.filter(c=>c.col!=='conc');
  const snapshot={
    cards:pendentes.map((card,i)=>({
      ...JSON.parse(JSON.stringify(card)),
      id:i+1,
      carriedFrom:prev
    })),
    caps,
    nextId:pendentes.length+1,
    gerada:false
  };
  await setDoc(docRef(week),snapshot);
}

async function loadWeek(week){
  document.getElementById('loading').style.display='flex';
  document.getElementById('board').style.display='none';
  if(unsubscribeCurrent)unsubscribeCurrent();
  if(unsubscribeNext)unsubscribeNext();

  // Sincroniza a partir da semana anterior ANTES de carregar
  await syncFromPrev(week);

  unsubscribeCurrent=onSnapshot(docRef(week),(snap)=>{
    weekData=snap.exists()?snap.data():{cards:[],caps:{},nextId:1,gerada:false};
    if(!weekData.gerada)weekData.gerada=false;
    document.getElementById('loading').style.display='none';
    document.getElementById('board').style.display='grid';
    setSyncStatus('ok');
    renderGerarBar();
    render();
  },()=>setSyncStatus('err'));
}

// ─── NAVEGAÇÃO ─────────────────────────────────────
window.changeWeek=async function(dir){
  const [yr,wn]=currentWeek.split('-W');
  const d=new Date(Number(yr),0,1+(Number(wn)-1)*7);
  d.setDate(d.getDate()+dir*7);
  currentWeek=weekKeyFromDate(d);
  document.getElementById('week-lbl').textContent=weekLabel(currentWeek);
  loadWeek(currentWeek);
};

// ─── BARRA GERAR SEMANA ────────────────────────────
function renderGerarBar(){
  const wrap=document.getElementById('gerar-semana-bar-wrap');
  if(!wrap)return;
  const next=nextWeekKey(currentWeek);
  const nextLbl=weekLabel(next).replace('Semana ','Sem. ');
  if(weekData.gerada){
    wrap.innerHTML='';
  }else{
    wrap.innerHTML=`<button class="btn-gerar" onclick="gerarProximaSemana()" style="white-space:nowrap">📅 Gerar ${nextLbl}</button>`;
  }
}

// ─── CAPACIDADE ────────────────────────────────────
function getCardMin(card){
  const col=card.col;
  if(card.min_setor&&card.min_setor[col]!==undefined)return parseInt(card.min_setor[col])||0;
  if(card.horas_setor&&card.horas_setor[col])return Math.round((parseFloat(card.horas_setor[col])||0)*60);
  return Math.round((parseFloat(card.horas)||0)*60);
}
function getCapMin(col){return parseInt(weekData.caps[col])||0;}
function getUsedMin(col){
  // Conta horas do setor para TODOS os cards exceto os na fila de espera
  return weekData.cards
    .filter(c=>c.col!=='fila')
    .reduce((a,card)=>{
      const min=card.min_setor?parseInt(card.min_setor[col])||0:0;
      return a+min;
    },0);
}
function getSaldoMin(col){const cap=getCapMin(col);if(!cap)return null;return cap-getUsedMin(col);}
function saldoClass(col){
  const cap=getCapMin(col);if(!cap)return 'neu';
  const s=getSaldoMin(col);
  if(s===null)return 'neu';
  if(s<0)return 'over';   // negativo = vermelho
  return 'ok';             // positivo ou zero = verde
}
function saldoText(col){
  const s=getSaldoMin(col);const used=getUsedMin(col);
  if(s===null)return used?`${minToTime(used)} em uso`:'—';
  if(s<0)return `−${minToTime(Math.abs(s))} (extra)`;
  if(s===0)return '00:00 livre';
  return `+${minToTime(s)} livre`;
}
function capPct(col){const cap=getCapMin(col);if(!cap)return 0;return Math.min(110,Math.round(getUsedMin(col)/cap*100));}
function capColor(col){
  const cap=getCapMin(col);if(!cap)return '#CBD5E1';
  const s=getSaldoMin(col);
  if(s===null)return '#CBD5E1';
  if(s<0)return '#ef4444';   // extra = vermelho
  return '#22c55e';           // livre = verde
}
window.setCap=function(col,val){weekData.caps[col]=timeToMin(val);saveWeek();render();};

// ─── ORDENAÇÃO ─────────────────────────────────────
// Ordem manual (campo 'ordem') tem prioridade.
// Sem ordem manual: ordena por data de entrega.
// Ao mover entre colunas: mantém ordem manual herdada da semana anterior.
// Ao reordenar manualmente dentro da coluna: define nova ordem.
function sortCards(cards){
  const comOrdem=cards.filter(c=>c.ordem!==undefined).sort((a,b)=>a.ordem-b.ordem);
  const semOrdem=cards.filter(c=>c.ordem===undefined).sort((a,b)=>{
    if(a.dataEntrega&&b.dataEntrega)return new Date(a.dataEntrega)-new Date(b.dataEntrega);
    if(a.dataEntrega)return -1;
    if(b.dataEntrega)return 1;
    return 0;
  });
  return [...comOrdem,...semOrdem];
}

function reorderInColumn(colId,draggedId,targetId,insertBefore){
  const colCards=sortCards(weekData.cards.filter(c=>c.col===colId));
  const dragged=colCards.find(c=>c.id===draggedId);
  if(!dragged)return;
  const filtered=colCards.filter(c=>c.id!==draggedId);
  const targetIdx=filtered.findIndex(c=>c.id===targetId);
  if(targetIdx===-1)filtered.push(dragged);
  else if(insertBefore)filtered.splice(targetIdx,0,dragged);
  else filtered.splice(targetIdx+1,0,dragged);
  filtered.forEach((card,i)=>{card.ordem=i;});
}

// ─── DRAG & DROP ───────────────────────────────────
function setupDrop(el,colId){
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over');});
  el.addEventListener('dragleave',()=>el.classList.remove('over'));
  el.addEventListener('drop',async e=>{
    e.preventDefault();e.stopPropagation();el.classList.remove('over');
    if(dragId===null)return;
    const card=weekData.cards.find(x=>x.id===dragId);
    if(!card||card.col===colId)return;
    card.col=colId;
    // Ao mover para nova coluna: vai para o fim (sem sobrescrever ordem manual herdada)
    const maxOrdem=weekData.cards.filter(c=>c.col===colId&&c.id!==card.id&&c.ordem!==undefined);
    if(maxOrdem.length>0) card.ordem=Math.max(...maxOrdem.map(c=>c.ordem))+1;
    else delete card.ordem;
    await saveWeek();
    render();
  });
}

function setupCardDrop(el,cardId,colId){
  el.addEventListener('dragover',e=>{
    e.preventDefault();e.stopPropagation();
    if(dragSourceCol!==colId)return; // só reordena dentro da mesma coluna
    const rect=el.getBoundingClientRect();
    el.style.borderTop=e.clientY<rect.top+rect.height/2?'2px solid #534AB7':'';
    el.style.borderBottom=e.clientY>=rect.top+rect.height/2?'2px solid #534AB7':'';
  });
  el.addEventListener('dragleave',()=>{el.style.borderTop='';el.style.borderBottom='';});
  el.addEventListener('drop',async e=>{
    e.preventDefault();e.stopPropagation();
    el.style.borderTop='';el.style.borderBottom='';
    if(dragId===null)return;
    const card=weekData.cards.find(x=>x.id===dragId);
    if(!card)return;
    if(dragId===cardId)return;
    if(dragSourceCol===colId){
      // Reordenação dentro da mesma coluna
      const rect=el.getBoundingClientRect();
      const insertBefore=e.clientY<rect.top+rect.height/2;
      reorderInColumn(colId,dragId,cardId,insertBefore);
    } else {
      // Movimento entre colunas — soltar sobre um card também funciona
      card.col=colId;
      const maxOrdem=weekData.cards.filter(c=>c.col===colId&&c.id!==card.id&&c.ordem!==undefined);
      if(maxOrdem.length>0) card.ordem=Math.max(...maxOrdem.map(c=>c.ordem))+1;
      else delete card.ordem;
    }
    await saveWeek();
    render();
  });
}

function render(){
  document.getElementById('week-lbl').textContent=weekLabel(currentWeek);
  const board=document.getElementById('board');
  board.innerHTML='';

  COLS.forEach(col=>{
    const cards=sortCards(weekData.cards.filter(c=>c.col===col.id));
    const sc=saldoClass(col.id);
    const isOver=sc==='over';
    const hasCap=!col.noCap;
    const capMin=getCapMin(col.id);

    const colEl=document.createElement('div');
    colEl.className=`col ${col.cls}`;

    let capHTML='';
    if(hasCap){
      capHTML=`<div class="cap-box">
        <div class="cap-row">
          <input class="cap-input" placeholder="000:00" maxlength="6"
            value="${capMin?minToTime(capMin):''}"
            title="Capacidade da semana"
            oninput="fmtCap(this)"
            onchange="setCap('${col.id}',this.value)" />
          <span class="cap-label">horas/<br>semana</span>
        </div>
        <div class="saldo ${sc}">${saldoText(col.id)}</div>
        ${isOver?'<div class="extra-pill">⚠ Necessita de hora extra</div>':''}
        <div class="cap-bar"><div class="cap-fill" style="width:${capPct(col.id)}%;background:${capColor(col.id)}"></div></div>
      </div>`;
    }else{
      capHTML='<div class="no-cap-spacer"></div>';
    }

    colEl.innerHTML=`
      <div class="col-title">
        <div class="col-dot" style="background:${col.color}"></div>
        <span style="color:${col.color}">${col.label}</span>
        <span class="col-count" style="color:${col.color}">${cards.length}</span>
      </div>
      ${capHTML}
      <div class="cards-list" id="list-${col.id}"></div>
    `;
    board.appendChild(colEl);

    const list=colEl.querySelector('.cards-list');

    if(cards.length===0){
      const dz=document.createElement('div');
      dz.className='drop-zone';
      dz.innerHTML='<span class="drop-hint">Arraste aqui</span>';
      setupDrop(dz,col.id);
      list.appendChild(dz);
    }else{
      cards.forEach(card=>{
        const isCarried=!!card.carriedFrom;
        const mAtual=getCardMin(card);
        const showH=!['fila','conc'].includes(card.col)&&mAtual>0;
        const dtFmt=card.dataEntrega?new Date(card.dataEntrega+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):'';
        const idxAtual=FLUXO.indexOf(card.col);
        const trackHTML=TRACK_COLS.map(tc=>{
          const idxTc=FLUXO.indexOf(tc.id);
          const passed=idxAtual>idxTc;
          const current=card.col===tc.id;
          const cls=passed?'passed':current?'current':'';
          return `<div class="track-sq ${cls}" style="background:${tc.color}" title="${tc.label}"><span style="color:#fff">${TRACK_LABEL[tc.id]}</span></div>`;
        }).join('');

        const el=document.createElement('div');
        el.className='card'+(isCarried?' carried':'')+(card.urgente?' urgente':'');
        el.draggable=true;
        el.dataset.id=card.id;
        el.innerHTML=`
          ${card.urgente?'<div class="urgente-badge">🚨 Urgente</div>':''}
          ${isCarried?'<div class="carried-tag">↗ Semana anterior</div>':''}
          <div class="card-os">${card.os}</div>
          <div class="card-cli">${card.cliente}</div>
          ${dtFmt?`<div style="font-size:10px;font-weight:600;color:#64748b;margin-top:2px">📅 ${dtFmt}</div>`:''}
          <div class="card-track">${trackHTML}</div>
          <div class="card-footer">
            <span class="card-h">⏱ ${showH?minToTime(mAtual):(card.min_total?minToTime(card.min_total):'—')}</span>
            <div class="card-btns">
              <button class="ib edit" onclick="editCard(${card.id})" title="Editar OS">✏</button>
              <button class="ib del" onclick="delCard(${card.id})" title="Remover OS">🗑</button>
            </div>
          </div>
        `;
        el.addEventListener('dragstart',()=>{dragId=card.id;dragSourceCol=card.col;el.classList.add('dragging');});
        el.addEventListener('dragend',()=>{
          dragId=null;dragSourceCol=null;
          el.classList.remove('dragging');
          document.querySelectorAll('.drop-zone,.card').forEach(z=>{
            z.classList.remove('over');z.style.borderTop='';z.style.borderBottom='';
          });
        });
        setupCardDrop(el,card.id,col.id);
        list.appendChild(el);
      });
      const dz=document.createElement('div');
      dz.className='drop-zone';dz.style.marginTop='6px';
      dz.innerHTML='<span class="drop-hint">+ soltar aqui</span>';
      setupDrop(dz,col.id);
      list.appendChild(dz);
    }
    setupDrop(colEl,col.id);
  });
}

window.saveCard=async function(){
  const os=document.getElementById('m-os').value.trim();
  const cli=document.getElementById('m-cli').value.trim();
  const err=document.getElementById('m-err');
  if(!os||!cli){err.textContent='Preencha OS e Cliente.';return;}
  const min_setor={};let minTotal=0;
  SETOR_IDS.forEach(s=>{const v=timeToMin(document.getElementById('h-'+s).value);min_setor[s]=v;minTotal+=v;});
  const dt=document.getElementById('m-dt').value;
  if(editingId!==null){
    if(weekData.cards.find(c=>c.os===os&&c.id!==editingId)){err.textContent='Essa OS já existe nesta semana.';return;}
    const card=weekData.cards.find(x=>x.id===editingId);if(!card)return;
    card.os=os;card.cliente=cli;card.min_setor=min_setor;card.min_total=minTotal;
    card.horas=minTotal/60;card.urgente=isUrgente;card.dataEntrega=dt;
  }else{
    if(weekData.cards.find(c=>c.os===os)){err.textContent='Essa OS já existe nesta semana.';return;}
    weekData.cards.push({id:weekData.nextId++,os,cliente:cli,min_setor,min_total:minTotal,
      horas:minTotal/60,col:'fila',urgente:isUrgente,dataEntrega:dt});
  }
  await saveWeek();
  closeModal();render();
};

    let capLine='';

      const cls=isOv?'over':isWa?'warn':'ok';

      if(isOv)capLine+=`<div style="margin-top:6px"><span class="extra">⚠ Necessita de hora extra</span></div>`;
    }else capLine=`<div class="ci" style="color:#94a3b8">Capacidade não informada — ${minToTime(usedMin)} em uso</div>`;
    const cardsHtml=cards.length===0?'<div class="empty">Nenhuma OS neste setor</div>':cards.map(c=>{
      const dtF=c.dataEntrega?new Date(c.dataEntrega+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):'';

    }).join('');
    html+=`<div class="page"><div class="ph" style="color:${col.color}"><div class="pt">${col.label}</div><div class="ps" style="color:#64748b">Controle de Produção — Metalrail — ${wl}</div>${capLine}</div><div class="cards">${cardsHtml}</div></div>`;
  });
  html+='</body></html>';
  const win=window.open('','_blank');
  win.document.write(html);win.document.close();win.focus();

};

async function renderDesempenho(){
  document.getElementById('desemp-week-lbl').textContent=weekLabel(desempWeek);
  const snap=await getDoc(docRef(desempWeek));
  const data=snap.exists()?snap.data():{cards:[],caps:{}};
  const cards=data.cards||[],caps=data.caps||{};
  const SP=COLS.filter(c=>!c.noCap);
  const conc=cards.filter(c=>c.col==='conc'),naof=cards.filter(c=>c.col!=='conc');
  let totR=0,totC=0;
  SP.forEach(col=>{
    totC+=parseInt(caps[col.id])||0;
    // Total realizado = soma de horas do setor para todas OS fora da fila de espera
    cards.forEach(card=>{
      if(card.col!=='fila')
        totR+=(card.min_setor?parseInt(card.min_setor[col.id])||0:0);
    });
  });
  const totO=totC>0?Math.round(totR/totC*100):0;
  document.getElementById('summary-bar').innerHTML=`
    <div class="summary-card"><div class="summary-icon" style="background:#EDE9FE">✅</div><div><div class="summary-val">${conc.length}</div><div class="summary-lbl">OS concluídas</div></div></div>
    <div class="summary-card"><div class="summary-icon" style="background:#FEF3C7">⚙</div><div><div class="summary-val" style="color:${naof.length>0?'#b45309':'#15803d'}">${naof.length}</div><div class="summary-lbl">OS não finalizadas</div></div></div>
    <div class="summary-card"><div class="summary-icon" style="background:#D1FAE5">⏱</div><div><div class="summary-val">${minToTime(totR)}</div><div class="summary-lbl">Horas realizadas</div></div></div>
    <div class="summary-card"><div class="summary-icon" style="background:#DBEAFE">📈</div><div><div class="summary-val" style="color:${totO<=69?'#dc2626':totO<=89?'#b45309':totO<=120?'#15803d':'#dc2626'}">${totC?totO+'%':'—'}</div><div class="summary-lbl">Ocupação geral</div></div></div>`;
  const grid=document.getElementById('desemp-grid');
  if(!cards.length){grid.innerHTML='<div class="no-data" style="grid-column:1/-1"><div class="no-data-icon">📈</div>Nenhuma OS registrada nesta semana</div>';return;}
  grid.innerHTML=SP.map(col=>{
    const capMin=parseInt(caps[col.id])||0;let passM=0;
    cards.forEach(card=>{
      // Conta horas do setor para TODAS as OS exceto as que estão na fila de espera
      if(card.col!=='fila')
        passM+=(card.min_setor?parseInt(card.min_setor[col.id])||0:0);
    });
    const pct=capMin>0?Math.min(999,Math.round(passM/capMin*100)):0;
    // 0-69%=vermelho, 70-89%=amarelo, 90-120%=verde, 121%+=vermelho
    const pc=!capMin?'gray':pct<=69?'red':pct<=89?'yellow':pct<=120?'green':'red';
    const bc=!capMin?'#E2E8F0':pct<=69?'#ef4444':pct<=89?'#f59e0b':pct<=120?'#22c55e':'#ef4444';
    // OS processadas = já passaram pelo setor (foram além)
    const osp=cards.filter(c=>FLUXO.indexOf(c.col)>FLUXO.indexOf(col.id)).length;
    // OS pendentes = ainda não chegaram ao setor
    const osPend=cards.filter(c=>FLUXO.indexOf(c.col)<FLUXO.indexOf(col.id)&&c.col!=='conc').length;
    return `<div class="desemp-card">
      <div class="desemp-header"><div class="desemp-dot" style="background:${col.color}"></div><span class="desemp-setor" style="color:${col.color}">${col.label}</span></div>
      <div class="desemp-label">Taxa de ocupação</div>
      <div class="desemp-metric-row"><div class="desemp-pct ${pc}">${capMin?pct+'%':'—'}</div></div>
      <div class="desemp-bar-bg"><div class="desemp-bar-fill" style="width:${Math.min(100,pct)}%;background:${bc}"></div></div>
      <div class="desemp-hours">
        <div class="desemp-h-item"><div class="desemp-h-val">${minToTime(passM)}</div><div class="desemp-h-lbl">Realizado</div></div>
        <div class="desemp-divider"></div>
        <div class="desemp-h-item"><div class="desemp-h-val">${capMin?minToTime(capMin):'—'}</div><div class="desemp-h-lbl">Capacidade</div></div>
      </div>
      <div class="desemp-stats">
        <div class="desemp-stat"><div class="desemp-stat-val">${osp}</div><div class="desemp-stat-lbl">OS processadas</div></div>
        <div class="desemp-stat ${osPend>0?'warn':''}"><div class="desemp-stat-val">${osPend}</div><div class="desemp-stat-lbl">OS pendentes</div></div>
      </div>
    </div>`;
  }).join('');
}

    badge.innerHTML=`<div><div class="user-badge-name">${displayName}</div><div class="user-badge-role">Editor</div></div>`;
  }
}

window.doLogin = async function(){
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const senha = document.getElementById('login-senha').value;
  const err = document.getElementById('login-err');
  if(!email||!senha){err.textContent='Preencha e-mail e senha.';return;}
  if(!EDITORS.includes(email)){err.textContent='Acesso de editor não autorizado para este e-mail.';return;}
  try{
    await signInWithEmailAndPassword(auth, email, senha);
    err.textContent='';
  }catch(e){
    if(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found'){
      err.textContent='E-mail ou senha incorretos.';
    } else {
      err.textContent='Erro ao fazer login. Tente novamente.';
    }
  }
};

window.doVisitor = function(){
  currentUser = null;
  isEditor = false;
  isVisitor = true;
  showApp();
  applyAccessMode();
  updateUserBadge();
  loadWeek(currentWeek);
};

window.doLogout = async function(){
  if(currentUser) await signOut(auth);
  currentUser = null;
  isEditor = false;
  isVisitor = false;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('main-app').style.display='none';
  document.body.classList.remove('readonly');
  document.getElementById('login-email').value='';
  document.getElementById('login-senha').value='';
};

onAuthStateChanged(auth, (user)=>{
  if(user){
    currentUser = user;
    isEditor = EDITORS.includes(user.email.toLowerCase());
    isVisitor = false;
    showApp();
    applyAccessMode();
    updateUserBadge();
    loadWeek(currentWeek);
  }
});

// Enter no campo de senha faz login
document.addEventListener('DOMContentLoaded',()=>{
  const senhaInput = document.getElementById('login-senha');
  if(senhaInput) senhaInput.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  const emailInput = document.getElementById('login-email');
  if(emailInput) emailInput.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('login-senha').focus();});
});

// ─── BUSCA DE OS ──────────────────────────────────
window.searchOS = async function(query){
  const resultsEl = document.getElementById('search-results');
  if(!resultsEl) return;
  query = query.trim().toLowerCase();
  if(query.length < 2){
    resultsEl.style.display='none';
    resultsEl.innerHTML='';
    return;
  }

  resultsEl.style.display='';
  resultsEl.innerHTML='<div class="search-empty">🔍 Buscando...</div>';

  // Busca em todas as semanas disponíveis
  // Lista as semanas a buscar: semana atual ± 12 semanas
  const results = [];
  const promises = [];
  for(let offset=-12; offset<=12; offset++){
    const d = new Date();
    d.setDate(d.getDate()+offset*7);
    const wk = weekKeyFromDate(d);
    promises.push(
      getDoc(docRef(wk)).then(snap=>{
        if(!snap.exists()) return;
        const data = snap.data();
        (data.cards||[]).forEach(card=>{
          const osMatch = card.os.toLowerCase().includes(query);
          const cliMatch = card.cliente.toLowerCase().includes(query);
          if(osMatch||cliMatch){
            const col = COLS.find(c=>c.id===card.col);
            results.push({
              os: card.os,
              cliente: card.cliente,
              setor: col?col.label:'—',
              setorColor: col?col.color:'#94a3b8',
              semana: weekLabel(wk),
              semanaKey: wk,
              urgente: card.urgente,
              dataEntrega: card.dataEntrega
            });
          }
        });
      }).catch(()=>{})
    );
  }
  await Promise.all(promises);

  if(results.length===0){
    resultsEl.innerHTML='<div class="search-results"><div class="search-empty">Nenhuma OS encontrada</div></div>';
    return;
  }

  // Ordena por semana
  results.sort((a,b)=>a.semanaKey.localeCompare(b.semanaKey));

  const html = results.map(r=>{
    const dtFmt = r.dataEntrega ? new Date(r.dataEntrega+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) : '';
    return `<div class="search-result-item">
      ${r.urgente?'<span style="font-size:12px">🚨</span>':''}
      <span class="search-result-os">${r.os}</span>
      <span class="search-result-cli">${r.cliente}${dtFmt?' · 📅 '+dtFmt:''}</span>
      <span class="search-result-loc" style="background:${r.setorColor}20;color:${r.setorColor}">${r.setor}</span>
      <span class="search-result-week">${r.semana}</span>
    </div>`;
  }).join('');

  resultsEl.innerHTML=`<div class="search-results">${html}</div>`;
};
